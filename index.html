<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的雲端空間</title>
    <style>
        /* 全域設定與 CSS 變數 (用來支援深色模式) */
        :root {
            --bg-color: #f8f9fa;
            --header-bg: #ffffff;
            --text-color: #3c4043;
            --text-light: #5f6368;
            --border-color: #dadce0;
            --sidebar-bg: #ffffff;
            --hover-bg: #f1f3f4;
            --active-bg: #e8f0fe;
            --active-text: #1a73e8;
            --card-bg: #ffffff;
            --search-bg: #f1f3f4;
        }

        [data-theme="dark"] {
            --bg-color: #202124;
            --header-bg: #2d2e30;
            --text-color: #e8eaed;
            --text-light: #9aa0a6;
            --border-color: #5f6368;
            --sidebar-bg: #2d2e30;
            --hover-bg: #3c4043;
            --active-bg: #404448;
            --active-text: #8ab4f8;
            --card-bg: #2d2e30;
            --search-bg: #202124;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 頂部導覽列 (Header) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            height: 64px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-bar input {
            width: 400px;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid transparent;
            background-color: var(--search-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        .search-bar input:focus {
            background-color: var(--card-bg);
            border: 1px solid #1a73e8;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* 深色模式切換按鈕 */
        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-color);
        }

        .user-profile {
            width: 35px;
            height: 35px;
            background-color: #1a73e8;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
        }

        /* 佈局容器 */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左側邊欄 (Sidebar) */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            padding: 20px 0;
            border-right: 1px solid var(--border-color);
        }

        .btn-new {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 24px;
            margin: 0 15px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-color);
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-new:hover {
            background-color: var(--hover-bg);
        }

        .nav-list {
            list-style: none;
        }

        .nav-item {
            padding: 12px 24px;
            color: var(--text-color);
            cursor: pointer;
            border-radius: 0 24px 24px 0;
            margin-right: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-item:hover {
            background-color: var(--hover-bg);
        }

        .nav-item.active {
            background-color: var(--active-bg);
            color: var(--active-text);
            font-weight: 500;
        }

        /* 主內容區 (Main Content) */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* 檔案與資料夾網格 */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            user-select: none;
        }

        .card:hover {
            background-color: var(--hover-bg);
        }

        /* 被選取的卡片樣式 */
        .card.selected {
            border: 2px solid var(--active-text);
            background-color: var(--active-bg);
        }

        .card-large {
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        .icon {
            font-size: 1.5rem;
        }

        .card-large .icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .filename {
            font-size: 0.9rem;
            color: var(--text-color);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            ☁️ 偽雲端硬碟
        </div>
        <div class="search-bar">
            <input type="text" placeholder="在雲端硬碟中搜尋...">
        </div>
        <div class="header-right">
            <button class="theme-toggle" id="themeBtn" title="切換深色模式">🌙</button>
            <div class="user-profile">U</div>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <button class="btn-new" id="newFolderBtn">➕ 新增</button>
            <ul class="nav-list">
                <li class="nav-item active">📁 我的雲端硬碟</li>
                <li class="nav-item">💻 電腦</li>
                <li class="nav-item">👥 與我共用</li>
                <li class="nav-item">🕒 最近存取</li>
                <li class="nav-item">⭐ 已加星號</li>
                <li class="nav-item">🗑️ 垃圾桶</li>
            </ul>
        </aside>

        <main class="main-content" id="mainArea">
            
            <div class="section-title">資料夾</div>
            <div class="file-grid" id="folderGrid">
                <div class="card">
                    <span class="icon">📁</span>
                    <span class="filename">工作專案</span>
                </div>
                <div class="card">
                    <span class="icon">📁</span>
                    <span class="filename">學習資料</span>
                </div>
                <div class="card">
                    <span class="icon">📁</span>
                    <span class="filename">2026 旅遊照片</span>
                </div>
            </div>

            <div class="section-title">檔案</div>
            <div class="file-grid">
                <div class="card card-large">
                    <span class="icon">📄</span>
                    <span class="filename">年度報告.docx</span>
                </div>
                <div class="card card-large">
                    <span class="icon">📊</span>
                    <span class="filename">財務報表.xlsx</span>
                </div>
                <div class="card card-large">
                    <span class="icon">🖼️</span>
                    <span class="filename">設計圖稿.png</span>
                </div>
                <div class="card card-large">
                    <span class="icon">🎬</span>
                    <span class="filename">宣傳影片.mp4</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. 卡片點擊選取功能
            function setupCardSelection() {
                const mainArea = document.getElementById('mainArea');
                
                // 使用事件委派 (Event Delegation) 處理點擊，這樣新生的資料夾也能被選取
                mainArea.addEventListener('click', (e) => {
                    const clickedCard = e.target.closest('.card');
                    
                    // 先清除所有卡片的選取狀態
                    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));

                    // 如果點擊的是卡片，則加上選取狀態並阻止事件擴散
                    if (clickedCard) {
                        clickedCard.classList.add('selected');
                        e.stopPropagation(); 
                    }
                });
            }

            // 2. 新增資料夾功能
            function setupNewFolder() {
                const newBtn = document.getElementById('newFolderBtn');
                const folderGrid = document.getElementById('folderGrid');

                newBtn.addEventListener('click', () => {
                    const folderName = prompt('請輸入新資料夾名稱：', '未命名資料夾');
                    
                    if (folderName && folderName.trim() !== '') {
                        const newCard = document.createElement('div');
                        newCard.className = 'card';
                        newCard.innerHTML = `<span class="icon">📁</span><span class="filename">${folderName}</span>`;
                        folderGrid.appendChild(newCard);
                    }
                });
            }

            // 3. 深色模式切換
            function setupThemeToggle() {
                const themeBtn = document.getElementById('themeBtn');
                const body = document.body;

                themeBtn.addEventListener('click', () => {
                    if (body.getAttribute('data-theme') === 'dark') {
                        body.removeAttribute('data-theme');
                        themeBtn.textContent = '🌙';
                    } else {
                        body.setAttribute('data-theme', 'dark');
                        themeBtn.textContent = '☀️';
                    }
                });
            }

            // 4. 左側選單切換效果 (視覺上)
            function setupNavSwitch() {
                const navItems = document.querySelectorAll('.nav-item');
                navItems.forEach(item => {
                    item.addEventListener('click', () => {
                        navItems.forEach(n => n.classList.remove('active'));
                        item.classList.add('active');
                    });
                });
            }

            // 執行所有初始化函式
            setupCardSelection();
            setupNewFolder();
            setupThemeToggle();
            setupNavSwitch();
        });
    </script>
</body>
</html>
